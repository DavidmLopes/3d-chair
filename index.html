<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Office Chair</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="webgl"></canvas>
    <script type="module" src="/src/main.js"></script>
    <div
      class="fixed bottom-0 left-0 z-[999] w-full space-y-2 overflow-hidden rounded-none bg-white px-4 py-4 backdrop-blur-sm sm:bottom-4 sm:left-4 sm:w-96 sm:space-y-4 sm:rounded-lg sm:bg-white/20 sm:py-8"
    >
      <div class="flex items-center justify-center gap-8">
        <span class="text-lg font-medium">Chair</span>
      </div>
      <div class="flex items-center justify-center gap-4">
        <button
          class="material-button active"
          type="button"
          data-material="LightWood"
          aria-label="Light Wood"
          aria-pressed="true"
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood1.jpg"
            alt=""
          />
        </button>
        <button
          class="material-button"
          type="button"
          data-material="DarkWood"
          aria-label="Dark Wood"
          aria-pressed="false"
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood2.jpg"
            alt=""
          />
        </button>
        <button
          class="material-button"
          type="button"
          data-material="Black"
          aria-label="Black"
          aria-pressed="false"
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood3.jpg"
            alt=""
          />
        </button>
        <button
          class="material-button"
          type="button"
          data-material="White"
          aria-label="White"
          aria-pressed="false"
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood4.jpg"
            alt=""
          />
        </button>
      </div>
      <div
        id="woodLabel"
        class="text-center text-xs text-neutral-400 sm:text-sm"
      >
        Light Wood
      </div>
    </div>
  </body>
</html>
