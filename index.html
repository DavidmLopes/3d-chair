<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3D Office Chair</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="webgl" aria-label="3D chair viewer" aria-busy="true"></canvas>
    <div id="loading-screen">
      <div class="loading-content">
        <div class="loading-progress-label">
          <p id="loading-message" role="status" aria-live="polite">
            Loading chair…
          </p>
          <span id="loading-percent" aria-hidden="true">0%</span>
        </div>
        <div id="loading-progress-group">
          <div
            id="loading-progress"
            role="progressbar"
            aria-label="Loading chair"
            aria-valuemin="0"
            aria-valuemax="100"
            aria-valuenow="0"
          >
            <div id="loading-progress-fill"></div>
          </div>
        </div>
        <button id="loading-retry" type="button" hidden>Try again</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
    <div
      class="fixed bottom-0 left-0 z-[999] w-full space-y-2 overflow-hidden rounded-none bg-white px-4 py-4 backdrop-blur-sm sm:bottom-4 sm:left-4 sm:w-96 sm:space-y-4 sm:rounded-lg sm:bg-white/20 sm:py-8"
    >
      <div class="flex items-center justify-center gap-8">
        <span class="text-lg font-medium">Chair</span>
      </div>
      <div class="flex items-center justify-center gap-4">
        <button
          class="material-button active"
          type="button"
          data-material="LightWood"
          aria-label="Light Wood"
          aria-pressed="true"
          disabled
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood1.jpg"
            alt=""
          />
        </button>
        <button
          class="material-button"
          type="button"
          data-material="DarkWood"
          aria-label="Dark Wood"
          aria-pressed="false"
          disabled
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood2.jpg"
            alt=""
          />
        </button>
        <button
          class="material-button"
          type="button"
          data-material="Black"
          aria-label="Black"
          aria-pressed="false"
          disabled
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood3.jpg"
            alt=""
          />
        </button>
        <button
          class="material-button"
          type="button"
          data-material="White"
          aria-label="White"
          aria-pressed="false"
          disabled
        >
          <img
            class="rounded-full select-none"
            src="/textures/Wood/Wood4.jpg"
            alt=""
          />
        </button>
      </div>
      <div
        id="woodLabel"
        class="text-center text-xs text-neutral-400 sm:text-sm"
      >
        Light Wood
      </div>
    </div>
  </body>
</html>
